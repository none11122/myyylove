<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Открытка для Азалины</title>

<!-- Google Fonts: Playfair Display — заголовки, Cormorant Garamond — текст, Caveat — рукописный курсив -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="stars stars--small"></div>
  <div class="stars stars--big"></div>
  <div class="glow"></div>
</div>

<div class="scene">

  <!-- ЭТАП 1: экран входа -->
  <section class="screen" id="screen-gate">
    <div class="gate">
      <p class="gate-eyebrow">✦</p>
      <h1 class="gate-title">Эта эмоция<br>закрыта словом</h1>
      <p class="gate-subtitle">Это то, как я тебя называю</p>

      <form class="gate-form" id="gate-form" autocomplete="off">
        <input
          type="text"
          id="gate-input"
          class="gate-input"
          placeholder="впиши слово"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button type="submit" class="gate-button">
          <span>Открыть</span>
        </button>
      </form>
    </div>
  </section>

  <div class="toast" id="toast">Я думал ты любишь меня(((</div>

  <!-- ЭТАП 2 и 3: имя, конверт, письмо -->
  <section class="screen hidden" id="screen-reveal">

    <div class="reveal-heading" id="reveal-heading">
      <h1 class="reveal-name">Азалина</h1>
      <p class="reveal-sub">Это для тебя</p>
    </div>

    <div class="envelope-wrap" id="envelope-wrap">

      <!-- КОНВЕРТ -->
      <div class="envelope" id="envelope">
        <svg class="envelope-svg" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
          <rect class="env-body" x="0" y="0" width="300" height="200" rx="10" />
          <path class="env-fold env-fold--left"   d="M10,190 L10,14 C10,11 12,10 15,12 L150,100 Z" />
          <path class="env-fold env-fold--right"  d="M290,190 L290,14 C290,11 288,10 285,12 L150,100 Z" />
          <path class="env-fold env-fold--top"    d="M14,10 L286,10 C289,10 290,12 288,15 L150,100 Z" />
        </svg>

        <p class="envelope-name">Азалина<span class="envelope-name-line"></span></p>
        <span class="envelope-badge">✦</span>

        <button class="seal" id="seal" type="button" aria-label="Открыть письмо">
          <span class="seal-body">
            <span class="seal-letter">А</span>
          </span>
          <span class="seal-glare"></span>
        </button>
      </div>

      <!-- ПИСЬМО, вырастает из конверта -->
      <div class="paper" id="paper">
        <button class="paper-close" id="paper-close" type="button" aria-label="Закрыть письмо">✕</button>
        <span class="paper-corner paper-corner--tl"></span>
        <span class="paper-corner paper-corner--br"></span>
        <div class="paper-scroll">
          <p class="paper-text" id="paper-text"></p>
        </div>
      </div>

    </div>

    <p class="hint" id="hint">Жми, там сюрприз</p>

  </section>

</div>

<script src="script.js"></script>
</body>
</html>
